<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
    <title>Form com BootStrap</title>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col">
                <h2 class="mt-3">Formulário para contato</h2>
                <form>
                    <label class="form-label" for="nome">Seu nome:</label>
                    <input class="form-control" type="text" id="nome" />
                    <label class="form-label" for="email">Seu e-mail:</label>
                    <input class="form-control" type="email" id="email" />
                    <label for="tel" class="form-label">Seu telefone:</label>
                    <input class="form-control" type="tel" />
                    <button type="button" class="btn btn-success mt-3" data-bs-toggle="collapse" data-bs-target="#mensagem-sucesso">Enviar</button>
                </form>
                <div class="collapse mt-3" id="mensagem-sucesso">
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                            Formulário enviado com sucesso! Entraremos em contato em breve.
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
                    </div>
                </div>
            </div>
        </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
